[project]
name = "platform-ai-gateway"
version = "0.1.0"
description = "Tenant-aware model routing and typed AI tool gateway"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn[standard]>=0.32,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
