name: One-time lockfile formatter

on:
  push:
    branches:
      - codex/full-platform-continuation-20261003

permissions:
  contents: write

jobs:
  format-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-platform-continuation-20261003
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write pnpm-lock.yaml
      - name: Commit formatted lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: format commerce workspace lockfile'
          git push origin HEAD:codex/full-platform-continuation-20261003
