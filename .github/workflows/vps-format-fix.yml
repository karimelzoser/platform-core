name: Temporary VPS format fix

on:
  push:
    branches: [codex/vps-backend-installation-20261013]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vps-backend-installation-20261013
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.6 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply pinned Prettier output
        run: pnpm exec prettier --write apps/web/app/auth/login/route.ts apps/web/app/auth/oidc.ts apps/web/middleware.ts docker/vps/compose.yml
      - name: Commit exact formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name platform-ci
          git config user.email platform-ci@users.noreply.github.com
          git add apps/web/app/auth/login/route.ts apps/web/app/auth/oidc.ts apps/web/middleware.ts docker/vps/compose.yml
          git commit -m 'style: apply exact VPS foundation formatting'
          git push origin HEAD:codex/vps-backend-installation-20261013
