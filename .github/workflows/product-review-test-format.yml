name: Product review test formatter

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/e2e/product-review.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: product-review-test-formatted-${{ github.sha }}
          path: apps/web/e2e/product-review.spec.ts
          if-no-files-found: error
