name: Returns final lint fix

on:
  push:
    branches:
      - codex/returns-exchanges-refunds-closure-20261010

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/returns-exchanges-refunds-closure-20261010
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Replace optional assertions with explicit existence checks
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/returns-lifecycle.ts')
          text = path.read_text()
          old = """    const resolvedExchange = await returns.get(contextA, exchangeRequest.result.requestId);\n    assert.equal(resolvedExchange?.status, 'RESOLVED');\n    assert.equal(resolvedExchange?.exchanges[0]?.status, 'FULFILLED');\n    assert.equal(\n      resolvedExchange?.exchanges[0]?.replacementOrderId,\n      replacementOrder.result.orderId,\n    );\n"""
          new = """    const resolvedExchange = await returns.get(contextA, exchangeRequest.result.requestId);\n    assert.ok(resolvedExchange);\n    const resolvedExchangeRecord = resolvedExchange.exchanges[0];\n    assert.ok(resolvedExchangeRecord);\n    assert.equal(resolvedExchange.status, 'RESOLVED');\n    assert.equal(resolvedExchangeRecord.status, 'FULFILLED');\n    assert.equal(resolvedExchangeRecord.replacementOrderId, replacementOrder.result.orderId);\n"""
          if old not in text:
              raise SystemExit('Expected resolved-exchange assertion block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write tests/integration/returns-lifecycle.ts
          pnpm exec eslint tests/integration/returns-lifecycle.ts
      - name: Commit exact test fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/returns-lifecycle.ts
          git commit -m 'test: assert resolved exchange explicitly'
          git push origin HEAD:codex/returns-exchanges-refunds-closure-20261010
