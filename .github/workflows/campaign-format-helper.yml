name: Campaign format artifact

on:
  push:
    branches:
      - codex/campaigns-production-closure-20261013-v2

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Campaign closure files
        run: >-
          pnpm exec prettier --write
          apps/api/src/campaigns.controller.ts
          apps/api/src/campaigns.service.ts
          apps/web/app/campaigns/page.tsx
          apps/web/e2e/campaigns-preview.spec.ts
          tests/integration/campaigns-lifecycle.ts
      - name: Upload formatted Campaign closure
        uses: actions/upload-artifact@v4
        with:
          name: campaign-formatted-${{ github.sha }}
          path: |
            apps/api/src/campaigns.controller.ts
            apps/api/src/campaigns.service.ts
            apps/web/app/campaigns/page.tsx
            apps/web/e2e/campaigns-preview.spec.ts
            tests/integration/campaigns-lifecycle.ts
          if-no-files-found: error
