name: Campaign format helper

on:
  push:
    branches:
      - codex/campaigns-production-closure-20261013-v2

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: format Campaigns closure') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Campaign closure files
        run: >-
          pnpm exec prettier --write
          apps/api/src/campaigns.controller.ts
          apps/api/src/campaigns.service.ts
          apps/web/app/campaigns/page.tsx
          apps/web/e2e/campaigns-preview.spec.ts
          tests/integration/campaigns-lifecycle.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/campaigns.controller.ts \
            apps/api/src/campaigns.service.ts \
            apps/web/app/campaigns/page.tsx \
            apps/web/e2e/campaigns-preview.spec.ts \
            tests/integration/campaigns-lifecycle.ts
          git commit -m 'style: format Campaigns closure'
          git push origin HEAD:codex/campaigns-production-closure-20261013-v2
