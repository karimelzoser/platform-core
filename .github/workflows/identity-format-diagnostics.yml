name: Identity format diagnostics

on:
  push:
    branches:
      - codex/identity-team-organization-closure-20261006

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture repository formatting diagnostics
        shell: bash
        run: |
          set +e
          pnpm format:check > format-check.log 2>&1
          format_status=$?
          pnpm prettier --write . > format-write.log 2>&1
          write_status=$?
          git diff --name-only > prettier-changed-files.txt
          printf '%s\n' "$format_status" > format-check.status
          printf '%s\n' "$write_status" > format-write.status
          cat format-check.log
          echo '--- prettier changed files ---'
          cat prettier-changed-files.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: identity-format-diagnostics
          path: |
            format-check.log
            format-check.status
            format-write.log
            format-write.status
            prettier-changed-files.txt
          if-no-files-found: error

  preview-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Capture hosted preview image diagnostics
        shell: bash
        run: |
          set +e
          docker build --file docker/Dockerfile.preview --tag platform-preview:diagnostic . > preview-build.log 2>&1
          status=$?
          printf '%s\n' "$status" > preview-build.status
          tail -n 200 preview-build.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: identity-preview-image-diagnostics
          path: |
            preview-build.log
            preview-build.status
          if-no-files-found: error
