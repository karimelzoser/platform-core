name: Identity formatting repair

on:
  push:
    branches:
      - codex/identity-team-organization-closure-20261006

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Apply canonical identity formatting'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/identity-team-organization-closure-20261006
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format identity closure files
        run: |
          pnpm prettier --write \
            apps/api/src/identity.controller.ts \
            apps/api/src/identity.service.ts \
            apps/web/app/onboarding/page.tsx \
            apps/web/app/organizations/actions.ts \
            apps/web/app/organizations/page.tsx \
            apps/web/app/settings/actions.ts \
            apps/web/app/settings/page.tsx \
            apps/web/app/team/actions.ts \
            apps/web/app/team/page.tsx \
            packages/auth/src/index.test.ts
      - name: Commit canonical formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/api/src/identity.controller.ts \
            apps/api/src/identity.service.ts \
            apps/web/app/onboarding/page.tsx \
            apps/web/app/organizations/actions.ts \
            apps/web/app/organizations/page.tsx \
            apps/web/app/settings/actions.ts \
            apps/web/app/settings/page.tsx \
            apps/web/app/team/actions.ts \
            apps/web/app/team/page.tsx \
            packages/auth/src/index.test.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            apps/api/src/identity.controller.ts \
            apps/api/src/identity.service.ts \
            apps/web/app/onboarding/page.tsx \
            apps/web/app/organizations/actions.ts \
            apps/web/app/organizations/page.tsx \
            apps/web/app/settings/actions.ts \
            apps/web/app/settings/page.tsx \
            apps/web/app/team/actions.ts \
            apps/web/app/team/page.tsx \
            packages/auth/src/index.test.ts
          git commit -m 'Apply canonical identity formatting'
          git push origin HEAD:codex/identity-team-organization-closure-20261006
