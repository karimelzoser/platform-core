name: Shipping repair once

on:
  push:
    branches: [codex/shipping-foundation-20261005]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shipping-foundation-20261005
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Keep tracking-event fixtures append-only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/shipping-routing-rls.sql')
          text = path.read_text()
          old = '''INSERT INTO shipping.tracking_events (
  tenant_id, store_id, shipment_id, package_id,
  event_type, normalized_status, occurred_at, dedupe_key, data
) VALUES
  (
    'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa',
    'aaaaaaaa-0000-0000-0000-000000000501',
    'aaaaaaaa-0000-0000-0000-000000000603',
    'aaaaaaaa-0000-0000-0000-000000000604',
    'OUT_FOR_DELIVERY',
    'OUT_FOR_DELIVERY',
    now(),
    'routing-out-for-delivery-1',
    '{"fixture":"routing"}'::jsonb
  ),
  (
    'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa',
    'aaaaaaaa-0000-0000-0000-000000000501',
    'aaaaaaaa-0000-0000-0000-000000000603',
    'aaaaaaaa-0000-0000-0000-000000000604',
    'DELIVERY_FAILED',
    'EXCEPTION',
    now() + interval '1 minute',
    'routing-delivery-failed-1',
    '{"fixture":"routing"}'::jsonb
  );

UPDATE shipping.tracking_events
SET raw_code = 'CUSTOMER_UNAVAILABLE',
    description = 'Customer unavailable during delivery'
WHERE tenant_id = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa'
  AND shipment_id = 'aaaaaaaa-0000-0000-0000-000000000603'
  AND dedupe_key = 'routing-delivery-failed-1';'''
          new = '''INSERT INTO shipping.tracking_events (
  tenant_id, store_id, shipment_id, package_id,
  event_type, normalized_status, raw_code, description,
  occurred_at, dedupe_key, data
) VALUES
  (
    'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa',
    'aaaaaaaa-0000-0000-0000-000000000501',
    'aaaaaaaa-0000-0000-0000-000000000603',
    'aaaaaaaa-0000-0000-0000-000000000604',
    'OUT_FOR_DELIVERY',
    'OUT_FOR_DELIVERY',
    NULL,
    NULL,
    now(),
    'routing-out-for-delivery-1',
    '{"fixture":"routing"}'::jsonb
  ),
  (
    'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa',
    'aaaaaaaa-0000-0000-0000-000000000501',
    'aaaaaaaa-0000-0000-0000-000000000603',
    'aaaaaaaa-0000-0000-0000-000000000604',
    'DELIVERY_FAILED',
    'EXCEPTION',
    'CUSTOMER_UNAVAILABLE',
    'Customer unavailable during delivery',
    now() + interval '1 minute',
    'routing-delivery-failed-1',
    '{"fixture":"routing"}'::jsonb
  );'''
          if old not in text:
              raise SystemExit('expected tracking-events fixture block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Format all flagged sources
        run: |
          pnpm exec prettier --write \
            apps/web/app/shipping/routing/page.tsx \
            apps/web/app/shipping/routing/routing.css \
            apps/web/e2e/shipping-preview.spec.ts \
            tests/package.json
          pnpm format:check
      - name: Remove one-run workflow and commit repairs
        run: |
          git rm .github/workflows/shipping-repair-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/shipping-routing-rls.sql \
            apps/web/app/shipping/routing/page.tsx \
            apps/web/app/shipping/routing/routing.css \
            apps/web/e2e/shipping-preview.spec.ts \
            tests/package.json
          git commit -m 'shipping: fix append-only tracking test and formatting'
          git push origin HEAD:codex/shipping-foundation-20261005
