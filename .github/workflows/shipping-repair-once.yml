name: Shipping repair once

on:
  push:
    branches:
      - codex/shipping-foundation-20261005

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shipping-foundation-20261005
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep tracking-event fixtures append-only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/integration/shipping-routing-rls.sql')
          text = path.read_text()
          text = text.replace(
              '  event_type, normalized_status, occurred_at, dedupe_key, data\n) VALUES',
              '  event_type, normalized_status, raw_code, description,\n  occurred_at, dedupe_key, data\n) VALUES',
              1,
          )
          text = text.replace(
              "    'OUT_FOR_DELIVERY',\n    'OUT_FOR_DELIVERY',\n    now(),",
              "    'OUT_FOR_DELIVERY',\n    'OUT_FOR_DELIVERY',\n    NULL,\n    NULL,\n    now(),",
              1,
          )
          text = text.replace(
              "    'DELIVERY_FAILED',\n    'EXCEPTION',\n    now() + interval '1 minute',",
              "    'DELIVERY_FAILED',\n    'EXCEPTION',\n    'CUSTOMER_UNAVAILABLE',\n    'Customer unavailable during delivery',\n    now() + interval '1 minute',",
              1,
          )
          marker = '\nUPDATE shipping.tracking_events\nSET raw_code = '
          start = text.find(marker)
          if start == -1:
              raise SystemExit('tracking-events UPDATE fixture block not found')
          end = text.find('\n\nDO $$', start)
          if end == -1:
              raise SystemExit('tracking-events UPDATE fixture block terminator not found')
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
      - name: Format and verify repository
        run: |
          pnpm exec prettier --write \
            apps/web/app/shipping/routing/page.tsx \
            apps/web/app/shipping/routing/routing.css \
            apps/web/e2e/shipping-preview.spec.ts \
            tests/package.json
          pnpm format:check
      - name: Remove one-run workflow and commit repairs
        run: |
          git rm .github/workflows/shipping-repair-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/integration/shipping-routing-rls.sql \
            apps/web/app/shipping/routing/page.tsx \
            apps/web/app/shipping/routing/routing.css \
            apps/web/e2e/shipping-preview.spec.ts \
            tests/package.json
          git commit -m 'shipping: fix append-only tracking test and formatting'
          git push origin HEAD:codex/shipping-foundation-20261005
