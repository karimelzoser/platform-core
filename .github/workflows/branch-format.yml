name: One-time branch formatter

on:
  push:
    branches:
      - codex/full-platform-continuation-20261003

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-platform-continuation-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Format affected TypeScript files
        run: |
          corepack pnpm exec prettier --write \
            apps/api/src/app.module.ts \
            packages/connectors/src/development-email.test.ts \
            packages/connectors/src/development-email.ts \
            packages/connectors/src/development-meta-embedded-signup.test.ts \
            packages/connectors/src/development-meta-embedded-signup.ts \
            packages/connectors/src/development-shopify-public-app.test.ts \
            packages/connectors/src/development-shopify-public-app.ts \
            packages/connectors/src/development-woocommerce.test.ts \
            packages/connectors/src/development-woocommerce.ts \
            packages/connectors/src/index.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/app.module.ts \
            packages/connectors/src/development-email.test.ts \
            packages/connectors/src/development-email.ts \
            packages/connectors/src/development-meta-embedded-signup.test.ts \
            packages/connectors/src/development-meta-embedded-signup.ts \
            packages/connectors/src/development-shopify-public-app.test.ts \
            packages/connectors/src/development-shopify-public-app.ts \
            packages/connectors/src/development-woocommerce.test.ts \
            packages/connectors/src/development-woocommerce.ts \
            packages/connectors/src/index.test.ts
          git commit -m 'style: apply repository prettier formatting'
          git push origin HEAD:codex/full-platform-continuation-20261003
