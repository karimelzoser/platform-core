name: Sales format preview

on:
  push:
    branches:
      - codex/sales-production-closure-20261012
    paths:
      - .github/workflows/sales-format-preview.yml

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sales-production-closure-20261012
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.6 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply reviewed Sales field-id patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/sales/page.tsx')
          text = path.read_text()
          replacements = {
              '<Field name="customerId" label="CRM customer ID" required />': '<Field scope="opportunity" name="customerId" label="CRM customer ID" required />',
              '<Field name="leadId" label="Lead ID (optional)" />': '<Field scope="opportunity" name="leadId" label="Lead ID (optional)" />',
              '<Field name="name" label="Opportunity name" required />': '<Field scope="opportunity" name="name" label="Opportunity name" required />',
              '<Field name="currencyCode" label="Currency" value="EGP" required maxLength={3} />': '<Field scope="opportunity" name="currencyCode" label="Currency" value="EGP" required maxLength={3} />',
              '<Field\n                    name="expectedValueMinor"': '<Field\n                    scope="opportunity"\n                    name="expectedValueMinor"',
              '<Field name="expectedCloseDate" label="Expected close" type="date" />': '<Field scope="opportunity" name="expectedCloseDate" label="Expected close" type="date" />',
              '<Field name="customerId" label="CRM customer ID" required />\n                <Field name="opportunityId"': '<Field scope="activity" name="customerId" label="CRM customer ID" required />\n                <Field scope="activity" name="opportunityId"',
              '<Field name="leadId" label="Lead ID" />': '<Field scope="activity" name="leadId" label="Lead ID" />',
              '<Field name="subject" label="Subject" required />': '<Field scope="activity" name="subject" label="Subject" required />',
              '<Field name="dueAt" label="Due at" type="datetime-local" />': '<Field scope="activity" name="dueAt" label="Due at" type="datetime-local" />',
              'function Field({\n  name,': 'function Field({\n  scope,\n  name,',
              '}: {\n  name: string;\n  label: string;': '}: {\n  scope: string;\n  name: string;\n  label: string;',
              '<label htmlFor={`sales-${name}`}>{label}</label>': '<label htmlFor={`sales-${scope}-${name}`}>{label}</label>',
              'id={`sales-${name}`}': 'id={`sales-${scope}-${name}`}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing reviewed replacement: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format exact Sales closure files
        run: |
          pnpm exec prettier --write \
            apps/api/src/sales.service.ts \
            apps/web/app/sales/actions.ts \
            apps/web/app/sales/page.tsx \
            apps/web/app/sales/pipeline-builder.tsx \
            apps/web/e2e/sales-preview.spec.ts \
            docs/CAPABILITY_EVIDENCE_MATRIX.md \
            docs/PRODUCTION_READINESS_MATRIX.md \
            tests/integration/sales-lifecycle.ts
      - name: Commit only the reviewed Sales files
        run: |
          git config user.name 'platform-ci'
          git config user.email 'platform-ci@users.noreply.github.com'
          git add \
            apps/api/src/sales.service.ts \
            apps/web/app/sales/actions.ts \
            apps/web/app/sales/page.tsx \
            apps/web/app/sales/pipeline-builder.tsx \
            apps/web/e2e/sales-preview.spec.ts \
            docs/CAPABILITY_EVIDENCE_MATRIX.md \
            docs/PRODUCTION_READINESS_MATRIX.md \
            tests/integration/sales-lifecycle.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
          else
            git commit -m 'style: apply exact Sales formatting'
            git push origin HEAD:codex/sales-production-closure-20261012
          fi
