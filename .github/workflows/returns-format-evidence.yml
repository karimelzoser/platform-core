name: Returns formatter evidence

on:
  pull_request:
    paths:
      - 'apps/api/src/returns.controller.ts'
      - 'packages/commerce/src/returns.ts'
      - '.github/workflows/returns-format-evidence.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Returns sources with repository-pinned Prettier
        run: pnpm exec prettier --write apps/api/src/returns.controller.ts packages/commerce/src/returns.ts
      - uses: actions/upload-artifact@v4
        with:
          name: returns-prettier-output
          path: |
            apps/api/src/returns.controller.ts
            packages/commerce/src/returns.ts
          if-no-files-found: error
