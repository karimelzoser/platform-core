name: One-time cross-cutting formatter

on:
  push:
    branches:
      - codex/cross-cutting-contracts-20261006

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format this branch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rm .github/workflows/format-cross-cutting-once.yml
          git diff --name-only origin/main...HEAD | while IFS= read -r file; do
            if [ -f "$file" ]; then
              pnpm exec prettier --write --ignore-unknown "$file"
            fi
          done
          pnpm format:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize cross-cutting formatting"
          git push origin HEAD:codex/cross-cutting-contracts-20261006
