name: Generate onboarding formatter artifact

on:
  push:
    branches:
      - codex/onboarding-production-closure-20261007
    paths:
      - '.github/workflows/onboarding-format-artifact.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format onboarding source files
        run: |
          pnpm exec prettier --write \
            apps/api/src/onboarding.controller.ts \
            apps/web/app/onboarding/page.tsx \
            tests/integration/onboarding-lifecycle.ts
      - name: Stage formatted artifact tree
        run: |
          mkdir -p formatted/apps/api/src formatted/apps/web/app/onboarding formatted/tests/integration
          cp apps/api/src/onboarding.controller.ts formatted/apps/api/src/onboarding.controller.ts
          cp apps/web/app/onboarding/page.tsx formatted/apps/web/app/onboarding/page.tsx
          cp tests/integration/onboarding-lifecycle.ts formatted/tests/integration/onboarding-lifecycle.ts
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-formatted-${{ github.run_id }}
          path: formatted
          if-no-files-found: error
