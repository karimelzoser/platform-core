name: One-time lockfile formatter

on:
  push:
    branches:
      - codex/onboarding-production-closure-20261007

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/onboarding-production-closure-20261007
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write pnpm-lock.yaml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already formatted.'
          else
            git commit -m 'style: format dependency lockfile'
            git push origin HEAD:codex/onboarding-production-closure-20261007
          fi
