name: Order workflow formatter

on:
  push:
    branches: [codex/order-workflows-hosted-preview-20261003]

concurrency:
  group: order-workflow-normalizer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/order-workflows-hosted-preview-20261003
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Normalize branch-local implementation details
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('apps/worker/src/provider-action-processor.ts')
          text = worker.read_text()
          text = text.replace(
              "import { sql, withTenantTransaction, type PlatformDatabase } from '@platform/database';",
              "import {\n  sql,\n  withTenantTransaction,\n  type PlatformDatabase,\n  type PlatformTransaction,\n} from '@platform/database';",
          )
          text = text.replace(
              "transaction: Parameters<Parameters<typeof withTenantTransaction>[2]>[0],",
              "transaction: PlatformTransaction,",
          )
          worker.write_text(text)

          detail = Path('apps/web/app/orders/[orderId]/page.tsx')
          text = detail.read_text()
          text = text.replace(
              "    return (await response.json()) as {\n      kind: 'success';\n      order: OrderDetail;\n      workflow: WorkflowDetail | null;\n    };",
              "    const payload = (await response.json()) as {\n      order: OrderDetail;\n      workflow: WorkflowDetail | null;\n    };\n    return { kind: 'success', ...payload };",
          )
          detail.write_text(text)
          PY
      - run: >-
          pnpm exec prettier --write
          packages/commerce/src/order-workflows.ts
          apps/worker/src/provider-action-processor.ts
          packages/connectors/src/development-shopify-public-app.ts
          packages/connectors/src/development-shopify-public-app.test.ts
          packages/connectors/src/development-woocommerce.ts
          packages/connectors/src/development-woocommerce.test.ts
          apps/api/src/app.module.ts
          apps/api/src/commerce.controller.ts
          apps/web/app/orders
          tests/integration/order-workflow-lifecycle.ts
          tests/integration/temporal-durability.ts
          tests/package.json
          docker/integration/compose.yml
          .github/workflows/ci.yml
          pnpm-lock.yaml
      - name: Commit normalization if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            pnpm-lock.yaml \
            packages/commerce/src/order-workflows.ts \
            apps/worker/src/provider-action-processor.ts \
            packages/connectors/src/development-shopify-public-app.ts \
            packages/connectors/src/development-shopify-public-app.test.ts \
            packages/connectors/src/development-woocommerce.ts \
            packages/connectors/src/development-woocommerce.test.ts \
            apps/api/src/app.module.ts \
            apps/api/src/commerce.controller.ts \
            apps/web/app/orders \
            tests/integration/order-workflow-lifecycle.ts \
            tests/integration/temporal-durability.ts \
            tests/package.json \
            docker/integration/compose.yml \
            .github/workflows/ci.yml
          git commit -m 'style: normalize order workflow surface'
          git push origin HEAD:codex/order-workflows-hosted-preview-20261003
      - run: pnpm --filter @platform/connectors... --filter @platform/worker... --filter @platform/commerce... --filter @platform/api... --filter @platform/web... build
      - run: pnpm --filter @platform/integration-tests typecheck
      - run: pnpm --filter @platform/connectors test
