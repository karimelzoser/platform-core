name: Order workflow formatter

on:
  push:
    branches: [codex/order-workflows-hosted-preview-20261003]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/order-workflows-hosted-preview-20261003
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/commerce/src/order-workflows.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/commerce/src/order-workflows.ts
          git commit -m 'style: format order workflow service'
          git push origin HEAD:codex/order-workflows-hosted-preview-20261003
