name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.5 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm migration:verify
      - run: pnpm -r --if-present build
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated integration stack
        run: scripts/integration/up.sh
      - name: Apply SQL migrations
        run: scripts/integration/migrate.sh
      - name: Verify migration and tenant-RLS behavior
        run: scripts/integration/test-migrations.sh
      - name: Stop isolated integration stack
        if: always()
        run: scripts/integration/down.sh
  ai-gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'apps/ai-gateway[dev]'
      - run: python -m ruff check apps/ai-gateway/app apps/ai-gateway/tests
      - run: PYTHONPATH=apps/ai-gateway pytest -q apps/ai-gateway/tests
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@main
        with: { extra_args: --only-verified }
