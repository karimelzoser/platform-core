name: One-run shipping routing repair

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Repair command contract fields
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/shipping-routing.service.ts')
          text = path.read_text()
          marker = "        audit: {\n          beforeState: async (_input, transaction) => {"
          if marker in text:
              start = text.index(marker)
              end_marker = "          afterState: (_input, result) => result,\n        },"
              end = text.index(end_marker, start)
              text = text[:start] + "        audit: { afterState: (_input, result) => result }," + text[end + len(end_marker):]
          text = text.replace('context.actor.type', 'context.actorType')
          text = text.replace('context.actor.id ?? null', 'context.actorId ?? null')
          path.write_text(text)
          PY
      - name: Format and verify repaired API
        run: |
          pnpm exec prettier --write apps/api/src/shipping-routing.service.ts apps/api/src/shipping-routing.controller.ts
          pnpm --filter @platform/api... build
      - name: Restore normal CI workflow
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit repaired sources and restored CI
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/shipping-routing.service.ts apps/api/src/shipping-routing.controller.ts .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m 'shipping: repair and format routing API'
          git push origin HEAD:${HEAD_BRANCH}
