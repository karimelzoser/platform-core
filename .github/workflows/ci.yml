name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm migration:verify
      - run: pnpm -r --if-present build
      - run: pnpm lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Start isolated integration stack
        env:
          INTEGRATION_HOST_PORTS: '1'
        run: scripts/integration/up.sh
      - name: Apply SQL migrations
        run: scripts/integration/migrate.sh
      - name: Verify migration and tenant-RLS behavior
        run: scripts/integration/test-migrations.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @platform/api... --filter @platform/worker... build
      - name: Verify two-tenant messaging lifecycle
        env:
          DATABASE_URL: postgres://platform_app:platform-test-app-password@127.0.0.1:5432/platform
          OPA_URL: http://127.0.0.1:8181
          KEYCLOAK_ISSUER: http://127.0.0.1:8080/realms/platform
          KEYCLOAK_JWKS_URL: http://127.0.0.1:8080/realms/platform/protocol/openid-connect/certs
          KEYCLOAK_CLIENT_ID: platform-web
        run: pnpm --filter @platform/integration-tests test:integration
      - name: Collect integration diagnostics
        if: failure()
        run: |
          docker compose -f docker/integration/compose.yml ps
          docker compose -f docker/integration/compose.yml logs --no-color
      - name: Stop isolated integration stack
        if: always()
        run: scripts/integration/down.sh
  api-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build API image with its workspace dependencies
        run: docker build --file docker/Dockerfile.api --tag platform-api:ci .
  ai-gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install './apps/ai-gateway[dev]'
      - run: python -m ruff check apps/ai-gateway/app apps/ai-gateway/tests
      - run: PYTHONPATH=apps/ai-gateway pytest -q apps/ai-gateway/tests
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@main
        with: { extra_args: --only-verified }
