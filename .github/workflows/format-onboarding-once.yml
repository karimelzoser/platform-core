name: One-time onboarding formatter

on:
  push:
    branches:
      - codex/onboarding-production-closure-20261007

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/onboarding-production-closure-20261007
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix onboarding lint and format touched files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/app/onboarding/page.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            ["profile?.countryCode ?? 'EG'", "profile ? profile.countryCode : 'EG'"],
            ["profile?.currencyCode ?? 'EGP'", "profile ? profile.currencyCode : 'EGP'"],
            ["profile?.locale ?? state.organization.locale", "profile ? profile.locale : state.organization.locale"],
            ["profile?.timezone ?? state.organization.timezone", "profile ? profile.timezone : state.organization.timezone"],
            ["profile?.industryCode ?? 'ECOMMERCE'", "profile ? profile.industryCode : 'ECOMMERCE'"],
            ["profile?.customerModel ?? 'B2C'", "profile ? profile.customerModel : 'B2C'"],
            ["profile?.commerceModel ?? 'ECOMMERCE'", "profile ? profile.commerceModel : 'ECOMMERCE'"],
            ["profile?.monthlyOrderVolumeBand ?? '101_1000'", "profile ? profile.monthlyOrderVolumeBand : '101_1000'"],
            ["profile?.monthlyConversationVolumeBand ?? '101_1000'", "profile ? profile.monthlyConversationVolumeBand : '101_1000'"],
          ];
          for (const [before, after] of replacements) {
            if (!source.includes(before)) throw new Error(`Expected onboarding expression was not found: ${before}`);
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write \
            apps/api/src/onboarding.service.ts \
            apps/web/app/onboarding/actions.ts \
            apps/web/app/onboarding/page.tsx \
            apps/web/e2e/onboarding-preview.spec.ts \
            docs/IMPLEMENTATION_STATUS.md \
            docs/PRODUCTION_READINESS_MATRIX.md \
            tests/integration/onboarding-lifecycle.ts
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/onboarding.service.ts apps/web/app/onboarding/actions.ts apps/web/app/onboarding/page.tsx apps/web/e2e/onboarding-preview.spec.ts docs/IMPLEMENTATION_STATUS.md docs/PRODUCTION_READINESS_MATRIX.md tests/integration/onboarding-lifecycle.ts
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
          else
            git commit -m 'style: format onboarding branch'
            git push origin HEAD:codex/onboarding-production-closure-20261007
          fi
