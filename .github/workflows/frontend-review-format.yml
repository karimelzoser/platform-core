name: Frontend review formatter

on:
  push:
    branches:
      - codex/frontend-review-mode-20261012

permissions:
  contents: read

jobs:
  format-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format frontend review files
        run: |
          pnpm exec prettier --write \
            apps/web/app/app-shell.tsx \
            apps/web/app/frontend-review.css \
            apps/web/app/page.tsx \
            apps/web/app/preview-surfaces.ts \
            'apps/web/app/review/[surface]/page.tsx' \
            apps/web/app/review-surfaces.ts
      - name: Package formatted files
        run: |
          mkdir -p formatted/apps/web/app/review/'[surface]'
          cp apps/web/app/app-shell.tsx formatted/apps/web/app/app-shell.tsx
          cp apps/web/app/frontend-review.css formatted/apps/web/app/frontend-review.css
          cp apps/web/app/page.tsx formatted/apps/web/app/page.tsx
          cp apps/web/app/preview-surfaces.ts formatted/apps/web/app/preview-surfaces.ts
          cp 'apps/web/app/review/[surface]/page.tsx' 'formatted/apps/web/app/review/[surface]/page.tsx'
          cp apps/web/app/review-surfaces.ts formatted/apps/web/app/review-surfaces.ts
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-review-formatted-${{ github.sha }}
          path: formatted
          if-no-files-found: error
